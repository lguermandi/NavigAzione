<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plancia di Comando</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Icone per il browser e per i dispositivi Apple -->
    <link rel="icon" href="img/icona.png" type="image/png">
    <link rel="apple-touch-icon" href="img/icona.png">
    
    <!-- IDENTIFICATIVO WEB-APP (Quello che mancava!) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
</head>
<body>
    
    <!-- Barra Navigazione Superiore -->
    <header class="topbar">
        <div class="logo-title">⛵ Plancia di Comando</div>
        <button id="menu-toggle" class="hamburger">☰</button>
    </header>

    <!-- Sfondo scuro quando il menu è aperto -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- Menu Laterale a scomparsa -->
    <nav id="sidebar" class="sidebar">
        <div class="sidebar-header">
            Moduli di Sistema
        </div>
        <div id="menu-moduli">
            <!-- I bottoni si generano da config.js -->
        </div>
    </nav>

    <!-- Contenitore Principale con IFRAME -->
    <main class="main-content" style="padding: 0; display: flex; flex-direction: column;">
        <iframe id="app-frame" style="width: 100%; flex-grow: 1; border: none; min-height: 85vh; background: transparent;"></iframe>
    </main>

    <script src="config.js"></script>
    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebar-overlay');

        function toggleMenu() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        }

        menuToggle.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        const menuContainer = document.getElementById('menu-moduli');
        APP_MODULI.forEach(modulo => {
            const btn = document.createElement('button');
            btn.className = 'menu-btn';
            btn.innerHTML = `${modulo.icona} ${modulo.titolo}`;
            btn.onclick = () => {
                document.getElementById('app-frame').src = modulo.file;
                toggleMenu(); 
            };
            menuContainer.appendChild(btn);
        });

        document.getElementById('app-frame').src = APP_MODULI[0].file;
    </script>

    <!-- ATTIVAZIONE SERVICE WORKER PER OFFLINE E INSTALLAZIONE APP -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker Registrato!'))
                    .catch(err => console.log('Errore Service Worker:', err));
            });
        }
    </script>
</body>
</html>
