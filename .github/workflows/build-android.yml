name: Build Android APK (Poseidon)

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Compilazione APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Scarica il codice dal repository
        uses: actions/checkout@v4

      - name: 2. Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Configura Java (richiesto da Android)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 4. Installa le dipendenze web
        run: npm install

      - name: 5. Sincronizza Capacitor
        run: |
          chmod +x node_modules/.bin/cap
          npx cap sync android

      - name: 6. Sblocca i permessi di compilazione
        run: chmod +x android/gradlew

      - name: 7. Genera il file APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 8. Carica l'APK per il download
        uses: actions/upload-artifact@v4
        with:
          name: Poseidon-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk