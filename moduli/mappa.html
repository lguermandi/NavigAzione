<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    
    <!-- Librerie CSS e JS di Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        #mappa-container { 
            height: 500px; 
            width: 100%; 
            border-radius: 8px; 
            border: 2px solid #334155; 
            z-index: 1;
            cursor: crosshair; /* Cambia il cursore per far capire che si può cliccare */
        }
        .dashboard-rotta {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dato-rotta {
            font-size: 1.5rem;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Mappa & Rotte 🌍</h1>
    <div class="subtitle">Plotter Cartografico e Calcolo Distanze</div>

    <!-- Pannello di controllo superiore -->
    <div class="dashboard-rotta">
        <div>
            <span style="color: #94a3b8; font-size: 0.9rem;">Distanza Totale Rotta</span><br>
            <span class="dato-rotta" id="distanza-totale">0.00</span> <span style="color: #38bdf8;">Nm</span>
        </div>
        <div>
            <button class="btn-action" style="background: #ef4444; padding: 10px 20px; font-size: 0.9rem;" onclick="cancellaRotta()">Cestina Rotta</button>
        </div>
    </div>

    <!-- Contenitore Mappa -->
    <div class="panel">
        <div id="mappa-container"></div>
        <p style="color: #94a3b8; font-size: 0.85rem; text-align: center; margin-top: 10px;">
            ℹ️ Clicca in sequenza sulla mappa per tracciare i waypoint.
        </p>
    </div>

    <script>
        // Inizializza mappa (Centrata sul Mediterraneo Occidentale)
        const map = L.map('mappa-container').setView([40.5, 6.0], 6);

        // Livello Base (Coste e Città)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

        // Livello Nautico (Fari, Boe, Batimetriche)
        L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

        // VARIABILI PER LA ROTTA
        let arrayWaypoint = []; // Salva le coordinate dei click
        let lineaRotta = null;  // L'oggetto "linea rossa" disegnata sulla mappa
        let totaleMetri = 0;

        // FUNZIONE: Clic sulla mappa
        map.on('click', function(e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            
            // Aggiungi il nuovo punto all'array
            arrayWaypoint.push([lat, lng]);
            
            // Metti un marcatore (il pallino) sul punto cliccato
            L.circleMarker([lat, lng], {
                radius: 5,
                color: '#ef4444',
                fillOpacity: 1
            }).addTo(map);

            // Ridisegna la linea rossa
            aggiornaDisegnoRotta();
        });

        // FUNZIONE: Aggiorna grafica e calcoli
        function aggiornaDisegnoRotta() {
            // Se c'è già una linea disegnata, la rimuove per non sovrapporle
            if (lineaRotta) {
                map.removeLayer(lineaRotta);
            }

            // Disegna la nuova linea spezzata che unisce tutti i punti
            lineaRotta = L.polyline(arrayWaypoint, {
                color: '#ef4444', 
                weight: 3,
                dashArray: '5, 10' // Rende la linea tratteggiata
            }).addTo(map);

            // Calcola la distanza
            totaleMetri = 0;
            if (arrayWaypoint.length > 1) {
                for (let i = 0; i < arrayWaypoint.length - 1; i++) {
                    // map.distance calcola i metri tra due coordinate considerando la curvatura terrestre
                    let puntoA = L.latLng(arrayWaypoint[i]);
                    let puntoB = L.latLng(arrayWaypoint[i+1]);
                    totaleMetri += map.distance(puntoA, puntoB);
                }
            }

            // Converte i metri in Miglia Nautiche (1 Nm = 1852 metri)
            const migliaNautiche = totaleMetri / 1852;
            document.getElementById('distanza-totale').textContent = migliaNautiche.toFixed(2);
        }

        // FUNZIONE: Azzera tutto
        function cancellaRotta() {
            // Rimuove tutti i livelli vettoriali (linee e pallini) dalla mappa
            map.eachLayer((layer) => {
                if (layer instanceof L.Polyline || layer instanceof L.CircleMarker) {
                    layer.remove();
                }
            });
            
            arrayWaypoint = [];
            lineaRotta = null;
            document.getElementById('distanza-totale').textContent = "0.00";
        }
    </script>
</body>
</html>
